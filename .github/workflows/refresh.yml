name: Refresh dashboard data

on:
  schedule:
    # Every day at 06:30 IST (01:00 UTC). Change the cron to suit your timezone.
    - cron: '0 1 * * *'
  workflow_dispatch: # lets you trigger a refresh manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch macro + company news (uses committed data200.json for stock list)
        run: node fetch-news.js

      - name: Fetch stock data + run decision engine (uses fresh news.json)
        run: node fetch-all.js --index=200

      - name: Build dashboard
        run: node build-dashboard.js data200.json dashboard.html

      - name: Commit refreshed data back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.html data200.json news.json cache-*.jsonl
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "Auto-refresh $(date -u +%Y-%m-%d)"; git push; fi

      - name: Stage site files
        run: |
          mkdir -p dist
          cp dashboard.html dist/index.html
          cp news.json dist/news.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
